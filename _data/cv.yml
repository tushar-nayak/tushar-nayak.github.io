- title: Experience
  type: time_table
  contents:
    - title: Staff Scientist, Surgical Biomechanics Lab
      institution: University of Chicago
      year: 2026-present
      description:
        - "Patient-specific vascular geometry and multiphysics modeling for geometric deep learning based predictive modeling."
        - Lead computer vision and deep learning researcher under Dr. Luka Pocivavsek, investigating relationships between integrated baseline Gaussian curvature, longitudinal curvature-adaptive patch-wise surface-area growth, and CFD-derived pressure and velocity fields.
        - Building CT/CTA-to-3D vascular modeling pipelines spanning segmentation, surface reconstruction, mesh processing, and anatomical correspondence, with extension toward biomechanical stress analysis.
    - title: Research Collaborator, Surreality Lab
      institution: University of Pittsburgh
      year: 2026-present
      description:
        - "Enhanced intraoperative speech analysis for awake craniotomy (TRACER)."
        - Contributing to an automated operating-room speech pipeline combining speaker attribution, word-onset localization, overlap detection, and neural source separation.
        - Evaluating overlap detection and selective source separation, auditing failure modes and robustness of diarization, temporal localization, and separation components.
    - title: Graduate Student Researcher, Computational Engineering and Robotics Lab
      institution: Carnegie Mellon University
      year: 2024-2026
      description:
        - "Real-time 3D vascular deformation estimation from monocular fluoroscopy for endovascular robotic surgery."
        - Developed FluoroGRID, a multimodal deep learning framework combining fluoroscopic input with preoperative vascular geometry, sparse control points, and acquisition metadata to predict 3D deformation.
        - Designed a quad-encoder architecture fusing image features, graph representations, sampled mesh geometry, and camera metadata with differentiable projection and physics-based geometric regularizers.
        - Built a synthetic data pipeline generating over 370,000 paired 3D-2D training examples; achieved real-time inference with sub-millimeter reconstruction precision. Presented initial results at the ELSR workshop, IROS 2026.
    - title: Research Assistant, The ∀ Lab and Image Science Lab
      institution: Carnegie Mellon University
      year: 2025
      description:
        - "Longitudinal glioblastoma evolution and MRI-based forecasting."
        - Built an Attention U-Net with temporal embeddings and Neural ODE dynamics for continuous-time glioblastoma forecasting from longitudinal multimodal MRI.
        - Reduced prediction MSE by 6.7% versus a persistence baseline and relative FLAIR-volume error by 98%; presented at the 2025 CMU Biomedical Engineering Forum.
    - title: Graduate Teaching Assistant
      institution: Carnegie Mellon University
      year: 2025-2026
      description:
        - Supported graduate courses in Applied Deep Learning, Fundamentals of Computational Biomedical Engineering, Computer Vision for Engineers, and Machine Learning in Experimental Biomedical Engineering Research.

- title: Selected Research Projects
  type: time_table
  contents:
    - title: Sparse Echocardiography to 3D Cardiac Volume Reconstruction
      year: 2025-2026
      description:
        - Coordinate-based neural implicit reconstruction recovering dense 3D left-ventricular occupancy from three sparse 2D echocardiography slices, achieving 0.864 Dice and 0.765 IoU on MITEA-CAP.
        - Extended toward explicit Gaussian occupancy representations, reaching 0.950 IoU in preliminary experiments.
    - title: Deformable 3D Reconstruction of Live Endoscopic Surgical Scenes
      year: 2026-present
      description:
        - Prototyping deformable 3D Gaussian Splatting for dynamic monocular endoscopic reconstruction with depth/pose initialization, differentiable rendering, and deformation fields.
        - Exploring semantic feature alignment for open-vocabulary querying of reconstructed surgical scenes.
    - title: Geometric Multi-View Breast Cancer Detection
      year: 2026
      description:
        - Geometric alignment and dual-view correspondence framework for paired CC/MLO mammography, integrating lesion segmentation, localization, registration, and cross-view attention.
        - Reduced cross-view lesion-centroid discrepancy by 99.1%, enabling spatially aligned multi-view representations for malignancy classification.
    - title: Sparse-View Coronary Vessel Reconstruction
      year: 2025
      description:
        - Research prototype for sparse-view 3D coronary vessel reconstruction from angiography projections using Gaussian geometry, differentiable rendering, and PINN-based hemodynamic regularization. Now archived.
    - title: Open Horizon Robotics Perception Curriculum
      year: 2025-present
      description:
        - Authoring open-source computer vision curriculum covering classical vision, deep learning, 3D vision, geometry, and perception physics.

